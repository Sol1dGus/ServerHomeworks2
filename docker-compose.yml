services:
  db:
    image: postgres:16
    container_name: attendance-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - attendance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    container_name: attendance-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-attendance}
      DB_USERNAME: ${POSTGRES_USER:-attendance}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_HTTP: ${LOG_LEVEL_HTTP:-INFO}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-8080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  attendance_pg:
